<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Photo</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f5f3ef;
            padding: 20px;
        }

        img {
            display: block;
            width: 100%;
            max-width: 600px;
            max-height: 90vh;
            object-fit: contain;
            border-radius: 12px;
        }
    </style>
</head>

<body>
    <img src="photo.jpg" alt="My Photo">
</body>
</html>
